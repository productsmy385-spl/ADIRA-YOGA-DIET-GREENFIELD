<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3cb067" />
      <stop offset="100%" stop-color="#2f5d43" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#389ce0" />
      <stop offset="100%" stop-color="#1e68b3" />
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdb813" />
      <stop offset="100%" stop-color="#f37021" />
    </radialGradient>
  </defs>

  <!-- Emblem Mark Group -->
  <g transform="translate(10, 10)">
    <!-- Sun -->
    <circle cx="50" cy="22" r="12" fill="url(#sunGrad)" />

    <!-- Wave -->
    <path d="M 12 70 C 25 50, 45 85, 75 60 C 85 50, 85 70, 75 75 C 50 90, 25 75, 12 70 Z" fill="url(#waveGrad)" />

    <!-- Meditating Lotus Figure -->
    <circle cx="50" cy="38" r="6" fill="#2f5d43" />
    <path d="M50 44 v18" stroke="#2f5d43" stroke-width="3" stroke-linecap="round" />
    <path d="M32 72 c8-10 18-10 26 0 c8-10 18-10 26 0" fill="none" stroke="#2f5d43" stroke-width="5" stroke-linecap="round" />

    <!-- Leaves -->
    <path d="M 20 40 C 10 25, 25 10, 35 25 C 30 35, 25 40, 20 40 Z" fill="url(#leafGrad)" />
    <path d="M 80 40 C 90 25, 75 10, 65 25 C 70 35, 75 40, 80 40 Z" fill="url(#leafGrad)" />
  </g>

  <!-- Typography -->
  <text x="120" y="62" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="34" font-weight="800" letter-spacing="3" fill="#2f5d43">
    ADIRA
  </text>
  <text x="120" y="85" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="14" font-weight="600" letter-spacing="6" fill="#5aa17f">
    WELLNESS
  </text>
  <text x="120" y="102" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" letter-spacing="2" fill="#718096">
    Wellness, In Balance.
  </text>
</svg>
