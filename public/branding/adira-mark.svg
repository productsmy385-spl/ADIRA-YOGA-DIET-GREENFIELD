  <circle cx="50" cy="38" r="6" fill="#2f5d43" />
  <path d="M50 44 v18" stroke="#2f5d43" stroke-width="3" stroke-linecap="round" />
  <path d="M32 72 c8-10 18-10 26 0 c8-10 18-10 26 0" fill="none" stroke="#2f5d43" stroke-width="5" stroke-linecap="round" />

  <!-- Leaves -->
