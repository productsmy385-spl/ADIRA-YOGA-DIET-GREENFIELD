<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="markLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3cb067" />
      <stop offset="100%" stop-color="#2f5d43" />
    </linearGradient>
    <linearGradient id="markWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#389ce0" />
      <stop offset="100%" stop-color="#1e68b3" />
    </linearGradient>
    <radialGradient id="markSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdb813" />
      <stop offset="100%" stop-color="#f37021" />
    </radialGradient>
  </defs>

  <!-- Background Aura Circle -->
  <circle cx="50" cy="50" r="46" fill="#f8faf8" stroke="#e2ece5" stroke-width="2" />

  <!-- Sun -->
