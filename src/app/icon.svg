      <ellipse cx="32" cy="41" rx="4.8" ry="12.5" transform="rotate(44 32 51)" />
    </g>
    <g opacity="0.78">
      <ellipse cx="32" cy="40" rx="5" ry="13" transform="rotate(-20 32 51)" />
      <ellipse cx="32" cy="40" rx="5" ry="13" transform="rotate(20 32 51)" />
    </g>
